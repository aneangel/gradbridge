name: ci

# CPU test suite on every push and pull request. GitHub-hosted runners have no GPU, so the GPU
# tests skip themselves (tests/test_gpu*.py call require_gpu).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install frameworks (CPU builds)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "jax[cpu]" tensorflow-cpu warp-lang pytest
          pip install -e .
      - name: Test (unexpected host copies are errors)
        env:
          GRADBRIDGE_CACHE_DIR: ${{ runner.temp }}/gradbridge-cache
        run: pytest -q -W error::gradbridge.HostCopyWarning
